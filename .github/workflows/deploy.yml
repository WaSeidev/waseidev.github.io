name: Deploy a SYFHome

on:
  # Solo tras un push a main, y encadenado a que CI haya pasado: nunca se
  # publica algo que no compila o que no pasa el formato.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Permite relanzar el despliegue a mano sin tener que hacer un commit vacío,
  # útil cuando el fallo fue del servidor y no del código.
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Publicar en waseidev.net
    # En workflow_run hay que comprobar la conclusión a mano: el evento salta
    # también cuando CI ha fallado.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Runner self-hosted en SYFHome: sale hacia fuera a por los trabajos, así
    # que no hace falta abrir el 22 ni depender de la IP pública. La etiqueta
    # `waseidev` la declara nixos/modulos/github-runner.nix en syfhome-config.
    runs-on: [self-hosted, waseidev]
    environment:
      name: produccion
      url: https://waseidev.net
    steps:
      # El dist/ ya lo compiló y validó CI, así que aquí no se vuelve a
      # compilar: se despliega exactamente el artefacto comprobado.
      - name: Descargar el build validado
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar que el build no viene vacío
        run: test -f dist/index.html

      - name: Publicar en la raíz que sirve nginx
        env:
          # Volumen del contenedor `webstatic` en docker/homeserver del repo
          # syfhome-config. Si cambia allí, hay que cambiarlo aquí.
          WEB_ROOT: /var/www/waseidev.net
        run: |
          set -euo pipefail
          test -d "$WEB_ROOT"

          # Se sincroniza el CONTENIDO, nunca se reemplaza el directorio: es un
          # bind mount de Docker, y un `mv` dejaría al contenedor apuntando al
          # inodo viejo, sirviendo la versión anterior para siempre.
          # --delete quita lo que ya no existe en el build.
          rsync -a --delete dist/ "$WEB_ROOT/"
