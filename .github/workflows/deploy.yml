name: Deploy Astro a SYFHome
on:
  push:
    branches: [main] # Se activa cuando subes algo a la rama main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Instalar dependencias y Compilar
        run: |
          npm install
          npm run build
      - name: Enviar archivos al servidor (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 # OJO: Usa el puerto que tengas abierto para SSH o tu VPN
          source: "dist/*"
          target: "/home/waseidel/Docker/sitio-web/html"
          strip_components: 1
