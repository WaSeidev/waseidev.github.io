name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push que pisa a otro cancela el anterior: no tiene sentido desplegar una
# versión que ya quedó vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Formato, tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Comprobar formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run check

      - name: Build de producción
        run: npm run build

      # El artifact es lo que se despliega: el servidor no recompila, así que
      # publica exactamente lo que pasó las comprobaciones.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
